<!-- @dsCard group="Spacing" viewport="700x180" name="Corner radii" subtitle="Generous and few; tiles are 28.5% of their side" -->
<!doctype html>
<html><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" /><body style="margin:0;background:var(--stage-900);color:var(--text);font-family:var(--font-sans)">
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:22px;align-items:end">
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:80px;border-radius:var(--radius-panel);background:var(--stage-700);box-shadow:inset 0 0 0 1px var(--hairline)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">panel 28</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:80px;border-radius:var(--radius-card);background:var(--paper)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">card 24</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:80px;border-radius:var(--radius-window);background:var(--paper)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">window 22</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:80px;border-radius:var(--radius-chip);background:var(--paper-2)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">chip 14</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="width:80px;height:80px;border-radius:var(--radius-tile);background:linear-gradient(155deg,#8FCBFF 0%,#3B98FF 45%,#1B63E6 100%)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">tile 28.5%</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:24px;border-radius:var(--radius-pill);background:var(--stage-700)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">pill 999</div></div>
</div>
</body></html>
