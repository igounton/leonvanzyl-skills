<!-- @dsCard group="Colors" viewport="700x170" name="Stage" subtitle="Graphite neutrals, lit from above; hairlines are white at low alpha" -->
<!doctype html>
<html><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" /><body style="margin:0;background:var(--stage-900);color:var(--text);font-family:var(--font-sans)">
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:20px">
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;border-radius:var(--radius-chip);background:var(--stage-950);box-shadow:inset 0 0 0 1px var(--hairline-strong)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">stage-950<br>#0B0C0E</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;border-radius:var(--radius-chip);background:var(--stage-900);box-shadow:inset 0 0 0 1px var(--hairline-strong)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">stage-900<br>#111214 canvas</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;border-radius:var(--radius-chip);background:var(--stage-800);box-shadow:inset 0 0 0 1px var(--hairline-strong)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">stage-800<br>#18191C glass</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;border-radius:var(--radius-chip);background:var(--stage-700);box-shadow:inset 0 0 0 1px var(--hairline-strong)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">stage-700<br>#212226 tracks</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;border-radius:var(--radius-chip);background:var(--stage-600);box-shadow:inset 0 0 0 1px var(--hairline-strong)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">stage-600<br>#2C2D31 spotlight</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;box-sizing:border-box;border-radius:var(--radius-chip);border:2px solid var(--hairline-strong)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">hairline<br>white 9% · 16%</div></div>
</div>
</body></html>
