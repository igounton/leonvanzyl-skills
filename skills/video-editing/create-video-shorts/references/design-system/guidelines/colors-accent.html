<!-- @dsCard group="Colors" viewport="700x190" name="Accents" subtitle="One accent per slide: azure by default, ember second; iris and mint for tiles" -->
<!doctype html>
<html><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" /><body style="margin:0;background:var(--stage-900);color:var(--text);font-family:var(--font-sans)">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px">
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:96px;border-radius:var(--radius-chip);background:var(--azure);box-shadow:0 20px 40px -22px var(--azure);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font:600 18px/1 var(--font-sans);color:#03142B">Azure</div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">#2F95FF · primary<br>subtitle, winner, cursor</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:96px;border-radius:var(--radius-chip);background:var(--ember);box-shadow:0 20px 40px -22px var(--ember);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font:600 18px/1 var(--font-sans);color:#2B0E02">Ember</div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">#FF8A5B · second<br>security, warnings, cost</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:96px;border-radius:var(--radius-chip);background:var(--iris);box-shadow:0 20px 40px -22px var(--iris);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font:600 18px/1 var(--font-sans);color:#150A38">Iris</div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">#9C7CFF<br>tiles, numbers in code</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:96px;border-radius:var(--radius-chip);background:var(--mint);box-shadow:0 20px 40px -22px var(--mint);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font:600 18px/1 var(--font-sans);color:#03261A">Mint</div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">#4FD6A0<br>tiles, positive deltas</div></div>
</div>
</body></html>
