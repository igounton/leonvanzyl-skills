<!-- @dsCard group="Type" viewport="700x280" name="Display & stats" subtitle="Figtree 600 with tight tracking; shown at 50% of slide size" -->
<!doctype html>
<html><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" /><body style="margin:0;background:var(--stage-900);color:var(--text);font-family:var(--font-sans)">
<div style="display:flex;flex-direction:column;gap:14px;padding:22px 24px">
<div style="display:flex;align-items:baseline;gap:18px"><div style="font:600 70px/1 var(--font-sans);letter-spacing:var(--track-display)">System One</div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">display 140 · −3.5%</div></div>
<div style="display:flex;align-items:baseline;gap:18px"><div style="font:600 48px/1.02 var(--font-sans);letter-spacing:var(--track-headline)">System 1 and 2</div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">headline 96 · −3%</div></div>
<div style="display:flex;align-items:baseline;gap:18px"><div style="font:600 56px/1 var(--font-sans);letter-spacing:var(--track-stat);font-variant-numeric:tabular-nums;color:var(--azure);text-shadow:0 0 40px rgba(47,149,255,0.4)">70–500 ms</div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">stat 112 · stat-xl 220 · tabular</div></div>
</div>
</body></html>
