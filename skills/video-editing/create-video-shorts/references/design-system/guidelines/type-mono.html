<!doctype html>

<div style="display:flex;align-items:baseline;gap:18px"><div style="font:500 24px/1.2 var(--font-mono);color:var(--text-secondary)">gpt-6 astra</div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);opacity:0.8">data 24 · row labels</div></div>
<div style="display:flex;align-items:baseline;gap:18px"><div style="font:400 22px/1.65 var(--font-mono);color:var(--code-text)">"model": <span style="color:var(--code-string)">"jev-latest"</span></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);opacity:0.8">code 22 · 1.65</div></div>
</div>
