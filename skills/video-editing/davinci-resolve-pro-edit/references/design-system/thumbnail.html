<!doctype html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="styles.css" />
<style>html,body{margin:0}body{width:1280px;height:854px;display:flex;font-family:var(--font-sans)}
.main{flex:1;min-width:0;background:var(--azure);display:flex;align-items:center;justify-content:center;padding:0 48px}
.mark{font-weight:600;letter-spacing:-0.035em;font-size:112px;line-height:1;color:var(--stage-950);white-space:nowrap}
.strip{width:320px;flex:none;display:flex;flex-direction:column}
.strip>div{flex:1}
a{color:var(--azure)}a:hover{color:#5AAEFF}</style>
</head><body>
<div class="main"><div class="mark">Leon YouTube</div></div>
<div class="strip"><div style="background:var(--stage-900)"></div><div style="background:var(--ember)"></div><div style="background:var(--iris)"></div><div style="background:var(--paper)"></div></div>
</body></html>
