<!-- @dsCard group="Brand" viewport="700x250" name="Glass, glow & paper" subtitle="Frosted glass over the wave, one accent glow per slide, paper casts a deep shadow" -->
<!doctype html>
<html><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" /><body style="margin:0;background:var(--stage-900);color:var(--text);font-family:var(--font-sans);overflow:hidden">
<div style="position:relative;height:250px">
<div style="position:absolute;left:0;right:0;bottom:0;height:52%;background-image:radial-gradient(rgba(255,255,255,0.24) 1.5px,rgba(255,255,255,0) 1.9px);background-size:12px 12px;border-top:2px solid rgba(47,149,255,0.7);box-shadow:0 -24px 44px -12px rgba(47,149,255,0.35)"></div>
<div style="position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:34px 30px">
<div class="ly-glass" style="padding:22px;height:150px;display:flex;flex-direction:column;justify-content:space-between"><div class="ly-label" style="font-size:12px">glass</div><div style="font:500 11px/1.4 var(--font-mono);color:var(--text-muted)">stage-800 62% · blur 24<br>hairline · shadow-panel</div></div>
<div class="ly-glass ly-glass--highlight" style="padding:22px;height:150px;display:flex;flex-direction:column;justify-content:space-between"><div class="ly-label ly-label--accent" style="font-size:12px">highlight</div><div style="font:500 11px/1.4 var(--font-mono);color:var(--text-muted)">accent hairline + bloom<br>once per slide</div></div>
<div style="padding:22px;height:150px;box-sizing:border-box;border-radius:var(--radius-card);background:var(--paper);box-shadow:var(--shadow-card);display:flex;flex-direction:column;justify-content:space-between"><div style="font:500 12px/1 var(--font-mono);letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-2)">paper</div><div style="font:500 11px/1.4 var(--font-mono);color:var(--ink-2)">shadow-card<br>shadow-window</div></div>
</div>
</div>
</body></html>
