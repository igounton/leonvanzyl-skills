<!-- @dsCard group="Colors" viewport="700x200" name="Paper" subtitle="White product UI floating on the stage; accent text uses its -ink shade" -->
<!doctype html>
<html><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" /><body style="margin:0;background:var(--stage-900);color:var(--text);font-family:var(--font-sans)">
<div style="margin:20px;padding:18px;border-radius:var(--radius-window);background:var(--paper);box-shadow:var(--shadow-window);display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:44px;border-radius:12px;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--paper-line)"></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-2)">paper-2 #F3F4F6<br>line #ECEDF0</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:44px;display:flex;align-items:center;font:600 20px/1 var(--font-sans);color:var(--ink)">Ink #111214</div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-2)">ink-2 #5F636B<br>secondary · 6.0:1</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:44px;display:flex;align-items:center"><span class="ly-pill ly-pill--azure">Choice</span></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-2)">azure-ink #1560D0<br>on azure-wash</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:44px;display:flex;align-items:center"><span class="ly-pill ly-pill--ember">Score</span></div><div style="font:500 11px/1.4 var(--font-mono);letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-2)">ember-ink #B8461A<br>on ember-wash</div></div>
</div>
</body></html>
